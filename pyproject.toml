[project]
name = "crisis-coordination-agents"
version = "0.1.0"
description = "Six independently built agent systems that detect, assess and respond to security incidents, coordinating only over Google's A2A protocol."
requires-python = ">=3.11,<3.13"

# This project does not install as a single distribution. The six systems are
# independent and run in separate virtualenvs; see requirements/ for the
# per-environment dependency sets. This file is the version-of-record for the
# toolchain Phase 0 was verified against.
dependencies = []

[project.optional-dependencies]
# Mirrors requirements/adk.txt -- the Google ADK systems (1 and 2).
adk = [
  "google-adk==2.11.0",
  "a2a-sdk[http-server]==1.2.1",
  "sse-starlette==3.5.0",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
]
# Mirrors requirements/crewai.txt -- the CrewAI systems (3, 4, 5 and 6).
crewai = [
  "crewai==1.15.23",
  "a2a-sdk[http-server]==1.2.1",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
]
# Mirrors requirements/target_app.txt -- the target app and test scripts.
target-app = [
  "Flask==3.1.3",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "requests==2.34.2",
]

[tool.crisis-coordination.phase0]
# Recorded for the Phase 0 exit criteria. See docs/PHASE0_REPORT.md.
verified_python = "3.11.9"
verified_platform = "Windows-11-10.0.26200"
google_adk = "2.11.0"
google_genai = "2.27.0"
crewai = "1.15.23"
a2a_sdk = "1.2.1"
postgres = "16-alpine"
a2a_protocol_version = "1.0"
incident_message_schema_version = "0.1.0"
